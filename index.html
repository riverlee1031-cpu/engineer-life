<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Engineer Life V19 · 科系對應工作揭曉版</title>
<meta name="theme-color" content="#02070a">
<style>
:root{--bg:#02070a;--panel:#061014;--panel2:#08181d;--line:#123b43;--green:#00ffa0;--cyan:#00d9ff;--yellow:#ffd166;--red:#ff5d73;--text:#d9f7ee;--muted:#6f9b92}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Courier New",monospace;min-height:100%}
body{background:linear-gradient(rgba(0,255,160,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,217,255,.02) 1px,transparent 1px),var(--bg);background-size:24px 24px}
button,input{font:inherit}button{cursor:pointer}#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(2,7,10,.96)}
.logo{display:flex;align-items:center;gap:9px;font-weight:1000;color:var(--green);letter-spacing:.08em}
.chip{width:26px;height:26px;border:2px solid var(--green);display:grid;place-items:center;color:var(--cyan);font-size:12px}
.topmeta{font-size:11px;color:var(--muted)}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr) 330px;min-height:calc(100vh - 49px)}
.left,.right{padding:14px;background:rgba(3,12,15,.86)}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.center{padding:18px;min-width:0}
.box{border:1px solid var(--line);background:linear-gradient(180deg,rgba(8,24,29,.96),rgba(4,14,18,.96));border-radius:6px;padding:14px;margin-bottom:12px}
.boxTitle{display:flex;justify-content:space-between;gap:10px;color:var(--green);font-weight:1000;font-size:12px;letter-spacing:.12em;margin-bottom:10px}.boxTitle span{color:var(--muted);font-weight:700}
.identity h1{font-size:30px;margin:4px 0 8px;color:#fff}.identity .sub{font-size:12px;line-height:1.7;color:#98c5b8}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{border:1px solid var(--line);color:#a8cfc4;border-radius:3px;padding:4px 6px;font-size:10px}.tag.gold{border-color:#695b2b;color:var(--yellow)}
.stat{margin-bottom:10px}.statHead{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}.statHead b{color:var(--yellow)}
.bar{height:7px;background:#102329;border-radius:99px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--green),var(--cyan));width:50%}
.timeline .node{display:flex;gap:10px;padding:8px 0;color:#63867f;font-size:11px}.timeline .dot{width:9px;height:9px;border:1px solid #31534c;border-radius:50%;margin-top:2px;flex:none}
.timeline .done,.timeline .current{color:#d6eee7}.timeline .done .dot{background:#2a7560;border-color:#2a7560}.timeline .current .dot{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 8px rgba(255,209,102,.5)}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.metric{border:1px solid var(--line);background:#07161a;padding:10px;border-radius:5px;text-align:center}
.metric b{display:block;color:var(--yellow);font-size:20px}.metric span{font-size:9px;color:var(--muted)}
.event h2{font-size:24px;margin:3px 0 10px;color:#fff;line-height:1.3}.event p{color:#b7d7ce;line-height:1.9;margin:0}
.kicker{font-size:10px;color:var(--cyan);letter-spacing:.12em;font-weight:900}
.choice{width:100%;text-align:left;background:#07191d;color:#e8fff7;border:1px solid #24545a;border-radius:5px;padding:12px;margin-bottom:8px}.choice:hover{border-color:var(--green)}
.choice b{display:block;font-size:14px}.choice span{display:block;font-size:11px;color:#8cb7ad;margin-top:4px}.choice em{display:block;font-size:9px;color:var(--yellow);font-style:normal;margin-top:5px}
.primary{width:100%;min-height:48px;border:1px solid var(--green);background:#0b2a22;color:var(--green);font-weight:1000;border-radius:5px}
.log{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed #14343a;font-size:11px}.log small{color:#5e8e84}.log div{color:#b9d7cf}
.startWrap{max-width:1100px;margin:0 auto;padding:34px 18px 50px}.hero{border:1px solid var(--line);padding:22px;background:rgba(4,16,20,.94);margin-bottom:14px}
.hero .ascii{white-space:pre;overflow:auto;display:inline-block;color:#eaf4ff;background:linear-gradient(90deg,#0b1738 0%,#12234d 52%,#0b1738 100%);border-top:4px solid #ff6b2f;border-bottom:4px solid #233e76;padding:14px 18px 12px;border-radius:2px;font-family:"MS Gothic","MingLiU","PMingLiU","Lucida Console","Courier New","Noto Sans Mono CJK TC",monospace;font-size:22px;font-weight:900;letter-spacing:.03em;line-height:1.35;text-shadow:1px 0 0 #dfe8f6,-1px 0 0 #dfe8f6,0 1px 0 #dfe8f6,0 -1px 0 #dfe8f6,3px 3px 0 rgba(8,20,46,.85),0 0 10px rgba(90,160,255,.18);box-shadow:inset 0 0 0 1px rgba(110,150,220,.24),0 10px 30px rgba(0,0,0,.35)}.hero h1{font-size:38px;margin:12px 0 8px;color:#fff}.hero p{line-height:1.9;color:#afcdc5;max-width:900px}
.setupGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:12px}.field label{display:block;font-size:10px;color:var(--cyan);margin-bottom:6px}
.field input{width:100%;background:#02090c;color:#ecfff8;border:1px solid #23505a;border-radius:4px;padding:10px}.inline{display:grid;grid-template-columns:1fr auto;gap:8px}
.diceBtn{min-width:110px;border:1px solid var(--yellow);background:#211c0d;color:var(--yellow);border-radius:4px;font-weight:900}
.educationCard{border:1px solid #27515b;background:#06161b;padding:12px;border-radius:5px}.educationCard b{display:block;color:#fff;font-size:16px}.educationCard span{display:block;color:#7fa49c;font-size:11px;margin-top:4px;line-height:1.6}.bonus{margin-top:8px;color:var(--yellow)!important}
.startStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.startStat{border:1px solid #1a4449;background:#051316;padding:10px}.startStat b{display:block;color:var(--green);font-size:18px}.startStat span{font-size:9px;color:var(--muted)}
.resultDice{width:70px;height:70px;border:2px solid var(--yellow);display:grid;place-items:center;color:var(--yellow);font-size:34px;font-weight:1000;margin:10px auto}.resultText{line-height:1.85;color:#d0e8e1;font-size:12px}
.deltaRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.delta{border:1px solid #2d5a50;border-radius:3px;padding:4px 6px;font-size:9px;color:#b7d5cc}.delta.good{color:var(--green)}.delta.bad{color:var(--red)}.note{font-size:10px;color:#668b82;line-height:1.7}
@media(max-width:1050px){.shell{grid-template-columns:minmax(0,1fr) 300px}.left{display:none}}
@media(max-width:780px){.shell{display:block}.right{border-left:0;border-top:1px solid var(--line)}.center,.right{padding:10px}.setupGrid{grid-template-columns:1fr}.hero h1{font-size:30px}.startStats{grid-template-columns:repeat(2,1fr)}}
</style>

<style id="v2-special-css">
.specialWarn{
  display:inline-flex;align-items:center;gap:6px;
  margin-bottom:8px;padding:5px 8px;
  border:1px solid #6f3b45;border-radius:3px;
  background:#1b0c10;color:#ff8192;
  font-size:10px;font-weight:900;letter-spacing:.08em
}
.conditionList{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:10px
}
.conditionTag{
  border:1px solid #34565b;background:#07181c;
  color:#8bb6ad;padding:4px 6px;border-radius:3px;font-size:9px
}
.conditionTag.hit{border-color:#7c3f48;color:#ff8394;background:#1a0d11}
.skillPoint{
  color:#ffd166!important;border-color:#675c2e!important
}
.endingBox{
  border-color:#7d3f48!important;
  background:linear-gradient(180deg,#210e13,#0b1012)!important
}
.endingBox h2{color:#ff8b9a!important}
.endingBadge{
  display:inline-block;margin-bottom:10px;padding:5px 8px;
  border:1px solid #96515d;color:#ff9aaa;background:#281017;font-size:10px;font-weight:900
}
</style>


<style id="v3-responsive-css">
:root{
  --leftW:clamp(210px,16vw,250px);
  --rightW:clamp(290px,24vw,350px);
}
html{width:100%;min-width:0;-webkit-text-size-adjust:100%}
body{width:100%;max-width:100%;overflow-x:hidden}
*,*:before,*:after{box-sizing:border-box}
img,canvas,svg{max-width:100%}

.shell{
  grid-template-columns:var(--leftW) minmax(0,1fr) var(--rightW)!important;
  width:100%;
  max-width:1920px;
  margin:0 auto;
}
.left,.center,.right{min-width:0}
.center{overflow:hidden}
.metrics{grid-template-columns:repeat(6,minmax(0,1fr))!important}
.metric{min-width:0}
.metric b{font-size:clamp(16px,1.35vw,21px)}
.event h2{font-size:clamp(21px,1.8vw,27px)}
.event p,.resultText{font-size:clamp(12px,1vw,14px)}
.choice b{font-size:clamp(13px,1.05vw,15px)}
.choice{min-height:58px}
.primary{min-height:50px}
.startWrap{width:min(1120px,100%);padding-left:clamp(14px,3vw,28px);padding-right:clamp(14px,3vw,28px)}
.hero h1{font-size:clamp(31px,4vw,42px)}
.hero p{font-size:clamp(13px,1.1vw,15px)}

.mobileProfile{display:none}
.mobileStatsBlock{display:none}

/* laptop */
@media(max-width:1200px) and (min-width:901px){
  :root{--leftW:210px;--rightW:300px}
  .left,.right{padding:11px}
  .center{padding:14px}
  .metrics{gap:5px}
  .metric{padding:8px 3px}
  .identity h1{font-size:25px}
}

/* tablet */
@media(max-width:900px) and (min-width:701px){
  .shell{
    display:grid!important;
    grid-template-columns:minmax(0,1fr) 280px!important;
  }
  .left{display:none!important}
  .center{padding:12px}
  .right{padding:10px;border-left:1px solid var(--line)}
  .metrics{grid-template-columns:repeat(3,1fr)!important;gap:6px}
  .mobileProfile{
    display:block;
    margin-bottom:10px
  }
  .mobileProfile .box{margin-bottom:8px}
}

/* phone */
@media(max-width:700px){
  body{overflow-x:hidden!important;overflow-y:auto!important}
  .topbar{
    position:sticky;
    top:0;
    padding:8px 10px;
    z-index:40;
  }
  .logo{font-size:13px}
  .chip{width:23px;height:23px;font-size:10px}
  .topmeta{display:none}

  .shell{
    display:block!important;
    width:100%!important;
    min-height:auto!important;
  }
  .left{display:none!important}
  .center{
    width:100%;
    padding:8px!important;
    overflow:visible!important;
  }
  .right{
    width:100%;
    padding:8px!important;
    border-left:0!important;
    border-top:1px solid var(--line);
    background:rgba(3,12,15,.92);
  }

  .mobileProfile{
    display:block!important;
    margin-bottom:8px;
  }
  .mobileProfile .identity{
    margin-bottom:8px;
  }
  .mobileProfile .identity h1{
    font-size:24px;
  }
  .mobileProfile .tagrow{
    gap:4px;
  }

  .metrics{
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    gap:5px;
  }
  .metric{
    padding:7px 3px!important;
    min-height:57px;
  }
  .metric b{
    font-size:16px!important;
  }
  .metric span{
    font-size:8px!important;
    white-space:nowrap;
  }

  .box{
    padding:11px!important;
    margin-bottom:8px!important;
    border-radius:5px;
  }
  .boxTitle{
    font-size:10px!important;
    letter-spacing:.08em;
  }
  .event h2{
    font-size:20px!important;
    line-height:1.35;
  }
  .event p,.resultText{
    font-size:13px!important;
    line-height:1.75;
  }
  .kicker{font-size:9px}
  .choice{
    padding:11px!important;
    min-height:60px;
    touch-action:manipulation;
  }
  .choice b{font-size:14px!important}
  .choice span{font-size:11px!important;line-height:1.45}
  .choice em{font-size:9px!important}
  .primary{
    min-height:54px!important;
    font-size:14px;
    touch-action:manipulation;
  }
  .resultDice{
    width:62px;height:62px;font-size:28px;
  }
  .log{
    grid-template-columns:78px 1fr!important;
    gap:7px!important;
    font-size:10px!important;
  }
  .log small{font-size:9px}
  .conditionList{gap:4px}
  .conditionTag{font-size:8px;padding:3px 5px}
  .specialWarn{font-size:9px}

  /* right rail becomes a normal section at the bottom */
  .right .box:first-child{
    margin-top:0;
  }
  .stat{margin-bottom:8px}
  .statHead{font-size:10px}
  .bar{height:6px}

  /* start screen */
  .startWrap{
    width:100%;
    padding:18px 10px 28px!important;
  }
  .hero{
    padding:14px!important;
    margin-bottom:9px!important;
  }
  .hero .ascii{
    font-size:9px!important;
  }
  .hero h1{
    font-size:27px!important;
    line-height:1.15;
  }
  .hero p{
    font-size:13px!important;
    line-height:1.75;
  }
  .setupGrid{
    grid-template-columns:1fr!important;
    gap:8px!important;
  }
  .inline{
    grid-template-columns:1fr!important;
    gap:6px!important;
  }
  .diceBtn{
    width:100%!important;
    min-height:44px;
  }
  .startStats{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
  }
  .startStat{
    padding:9px!important;
  }
  .startStat b{font-size:17px!important}
  .educationCard b{font-size:14px}
}

/* very small phones */
@media(max-width:390px){
  .center,.right{padding-left:6px!important;padding-right:6px!important}
  .metrics{gap:4px}
  .metric{padding:6px 2px!important}
  .metric b{font-size:15px!important}
  .metric span{font-size:7.5px!important}
  .event h2{font-size:18px!important}
  .event p,.resultText{font-size:12.5px!important}
  .hero h1{font-size:24px!important}
}
</style>


<style id="v4-job-company-css">
.profileAvatar{
  width:82px;height:82px;flex:none;border:1px solid #2b5960;border-radius:5px;overflow:hidden;background:#0b1822
}
.profileAvatar img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.profileGrid{display:flex;gap:12px;align-items:center}
.jobCard{
  border:1px solid #285660;background:#06181d;padding:12px;border-radius:5px
}
.jobCard b{display:block;color:#fff;font-size:15px}
.jobCard span{display:block;color:#7fa69c;font-size:11px;line-height:1.6;margin-top:4px}
.jobCard .bonus{color:var(--yellow)!important}
.prologueCard{
  border-color:#2c6670!important;
  background:
    radial-gradient(circle at 90% 10%,rgba(0,217,255,.07),transparent 30%),
    linear-gradient(180deg,#081a20,#061116)!important
}
.prologueCard .quote{
  border-left:2px solid var(--yellow);padding:9px 11px;margin:10px 0 14px;background:#0b171a;color:#e7d797;font-size:12px;line-height:1.7
}
.prologueCard p{font-size:13px;line-height:1.9;color:#bdd7cf}
.prologueCard strong{color:var(--green)}
.prologueMeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.prologueMeta span{border:1px solid #28545b;padding:4px 6px;border-radius:3px;font-size:9px;color:#9cc6bb}
@media(max-width:700px){
  .profileAvatar{width:68px;height:68px}
  .profileGrid{align-items:flex-start}
  .prologueCard p{font-size:12.5px}
}
</style>


<style id="v7-stage-reward-css">
.stageReward{
  border-color:#7b682b!important;
  background:linear-gradient(180deg,#142d22,#0b1d17)!important
}
.rewardPoints{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;margin:10px 0;border:1px solid #6c5b29;background:#211d0e;border-radius:5px
}
.rewardPoints b{font-size:26px;color:var(--yellow)}
.rewardGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rewardStat{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:10px;border:1px solid #285057;background:#07171b;border-radius:5px
}
.rewardStat b{color:#fff}.rewardStat span{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.rewardStat button{
  border:1px solid var(--green);background:#0b2a22;color:var(--green);
  border-radius:4px;padding:8px 10px;font-weight:900
}

.eventTypeBadge{
  display:inline-block;margin-bottom:7px;padding:4px 7px;border:1px solid #315960;
  background:#0a2025;color:var(--cyan);font-size:9px;font-weight:900
}
@media(max-width:700px){.rewardGrid{grid-template-columns:1fr}}
</style>


<style id="v8-credit-css">
.versionStrip{
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-top:12px;padding-top:10px;border-top:1px dashed #1b444a;
  color:#719a91;font-size:10px
}
.versionStrip b{color:var(--green)}
.creditRiver{color:var(--yellow)!important;font-weight:900}
.siteFooter{
  padding:12px 16px;border-top:1px solid var(--line);
  background:#02090c;color:#52776f;font-size:10px;text-align:center
}
.siteFooter b{color:var(--green)}
.siteFooter .credit{color:var(--yellow)}
</style>


<style id="v10-menu-radar-css">
.menuWrap{position:relative}
.menuBtn{
  border:1px solid #2e5e65;background:#07171b;color:var(--green);
  border-radius:4px;padding:7px 10px;font-weight:900;font-size:11px
}

  position:absolute;right:0;top:calc(100% + 6px);min-width:210px;
  border:1px solid var(--line);background:#041014;box-shadow:0 12px 30px rgba(0,0,0,.45);
  z-index:80;border-radius:5px;overflow:hidden
}
.menuDrop button{
  width:100%;text-align:left;border:0;border-bottom:1px solid #14343a;
  background:#06171b;color:#d8f4ec;padding:11px 12px;font-size:11px
}
.menuDrop button:hover{background:#0a2427;color:var(--green)}

  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;

}

  border:1px solid #2c5960;background:#061318;border-radius:8px;padding:16px
}

.modalHead h3{margin:0;color:var(--green)}
.closeBtn{border:1px solid #5b3b43;background:#190d11;color:#ff8795;border-radius:4px;padding:7px 10px}
.radarWrap{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:center}
#abilityRadar{width:100%;max-width:300px;aspect-ratio:1/1;background:#07161b;border:1px solid #173a40;border-radius:6px}
.nickBadge{
  display:inline-block;padding:6px 9px;border:1px solid #79672e;background:#201b0d;
  color:var(--yellow);font-weight:900;font-size:11px;margin-bottom:8px
}
.careerRow{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed #15373d;font-size:11px}
.careerRow span:first-child{color:#71998f}.careerRow b{color:#e9fff8}

}
</style>


<style id="v11-edu-css">
.educationCard b{line-height:1.65}
.educationCard .bonus{line-height:1.6}
</style>


<style id="v12-income-ending-css">
.salaryTable{width:100%;border-collapse:collapse;margin-top:8px;font-size:10px}
.salaryTable th,.salaryTable td{border-bottom:1px dashed #17363c;padding:7px 5px;text-align:left}
.salaryTable th{color:#6f9d92;font-weight:700}
.salaryTable td b{color:var(--yellow)}
.moneyHero{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0
}
.moneyHero div{border:1px solid #2b5158;background:#07171b;padding:10px;border-radius:5px}
.moneyHero b{display:block;color:var(--yellow);font-size:20px}
.moneyHero span{font-size:9px;color:var(--muted)}
.endingGood{border-color:#4b774f!important;background:linear-gradient(180deg,#10261a,#07140e)!important}
.endingBad{border-color:#7a3f47!important;background:linear-gradient(180deg,#220d12,#10090b)!important}
.endingRate{
  margin:8px 0 12px;padding:7px 9px;border:1px dashed #4a5960;color:#8ca8a1;font-size:10px
}
.rareGrowth{
  border-color:#6c5c2b!important;background:linear-gradient(180deg,#201c0c,#10130c)!important
}
.rareGrowth .kicker{color:var(--yellow)!important}
@media(max-width:700px){.moneyHero{grid-template-columns:1fr 1fr}.salaryTable{font-size:9px}}
</style>


<style id="v13-dice-css">
.diceStage{
  display:grid;place-items:center;text-align:center;min-height:260px;
  border:1px solid #34545b;background:
    radial-gradient(circle at center,rgba(0,255,160,.07),transparent 45%),
    #061318;border-radius:7px;padding:20px
}
.diceCube{
  width:92px;height:92px;border:3px solid var(--yellow);border-radius:14px;
  display:grid;place-items:center;background:#171408;color:var(--yellow);
  font-size:48px;font-weight:1000;
  box-shadow:0 0 22px rgba(255,209,102,.18);
  transform-origin:center;
}
.diceCube.rolling{
  animation:diceShake .18s infinite alternate ease-in-out;
}
@keyframes diceShake{
  0%{transform:rotate(-10deg) translate(-5px,2px) scale(.96)}
  25%{transform:rotate(8deg) translate(4px,-3px) scale(1.04)}
  50%{transform:rotate(-5deg) translate(2px,5px) scale(.98)}
  75%{transform:rotate(12deg) translate(-4px,-1px) scale(1.03)}
  100%{transform:rotate(-8deg) translate(5px,2px) scale(.97)}
}
.diceHint{margin-top:14px;color:#91b8ae;font-size:11px;line-height:1.7}
.diceHint strong{color:var(--yellow)}
.diceOdds{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px
}
.diceOdds span{
  border:1px solid #31545a;background:#081b20;padding:5px 8px;border-radius:3px;font-size:9px;color:#8fb9af
}
.diceOdds .good{border-color:#456b4b;color:var(--green)}
.diceOdds .bad{border-color:#6e3e47;color:#ff8795}
.outcomeBadge{
  display:inline-block;margin-bottom:8px;padding:5px 8px;border-radius:3px;
  font-size:10px;font-weight:900
}
.outcomeBadge.good{border:1px solid #476f4e;color:var(--green);background:#0c2114}
.outcomeBadge.bad{border:1px solid #75404a;color:#ff8e9d;background:#220f14}
@media(max-width:700px){
  .diceStage{min-height:220px;padding:16px}
  .diceCube{width:80px;height:80px;font-size:42px}
}
</style>


<style id="v16-bbs-title-large">
@media(max-width:780px){
  .hero .ascii{
    font-size:14px!important;
    line-height:1.28!important;
    letter-spacing:0!important;
    overflow-x:auto!important;
    padding:10px 12px!important;
  }
}
@media(max-width:430px){
  .hero .ascii{
    font-size:11px!important;
  }
}
</style>


<style id="v18-bbs-image-banner">
.hero .ascii{display:none!important}
.bbsHeroBanner{
  width:100%;
  max-width:1640px;
  height:auto;
  display:block;
  margin:0 auto 14px;
  object-fit:contain;
  image-rendering:auto;
  filter:none;
  transform:none;
  backface-visibility:hidden;
}
.bbsHeroBannerWrap{
  width:100%;
  overflow:hidden;
  background:#000;
  line-height:0;
  margin-bottom:12px;
}
@media(max-width:780px){
  .bbsHeroBanner{
    width:100%;
    min-width:0;
    margin:0 auto 10px;
  }
  .bbsHeroBannerWrap{margin-bottom:8px}
}
</style>

function tuneBaseStats(base,tier,eduType){
  const s=deep(base);
  const adj = eduType==="頂級學府"
    ? {health:-10,obedience:+0,stress:-11,tech:-12,comm:-5,slack:-6,luck:-6}
    : eduType==="國立體系"
    ? {health:-15,obedience:-4,stress:-10,tech:-16,comm:-6,slack:-7,luck:-6}
    : eduType==="混血學歷"
    ? {health:-16,obedience:-3,stress:-10,tech:-15,comm:-6,slack:-7,luck:-6}
    : {health:-22,obedience:-6,stress:-8,tech:-11,comm:-8,slack:-9,luck:-6};
  Object.keys(s).forEach(k=>{ s[k]=clamp((s[k]||0)+(adj[k]||0)); });
  if(tier!=="SS"){
    s.health=Math.min(s.health,64);
    s.tech=Math.min(s.tech,74);
    s.stress=Math.min(s.stress,70);
    s.comm=Math.min(s.comm,61);
    s.luck=Math.min(s.luck,60);
  }else{
    s.health=Math.min(s.health,68);
    s.tech=Math.min(s.tech,84);
    s.stress=Math.min(s.stress,78);
    s.comm=Math.min(s.comm,64);
    s.luck=Math.min(s.luck,66);
  }
  return s;
}
function normalizeEduProfile(p){
  const e=deep(p);
  e.school=e.masterSchool;
  e.dept=e.masterDept;
  e.degree="碩士";
  e.base=tuneBaseStats(e.base,e.tier,e.eduType);
  return e;
}
function randomEduV11(){
  const r=Math.random();
  if(r<0.10)return normalizeEduProfile(rand(EDUCATION_PROFILES.SS));
  if(r<0.60)return normalizeEduProfile(rand(EDUCATION_PROFILES.NATIONAL));
  if(r<0.90)return normalizeEduProfile(rand(EDUCATION_PROFILES.MIXED));
  return normalizeEduProfile(rand(EDUCATION_PROFILES.PRIVATE));
}
function eduFullText(e){
  return `大學｜${e.bachelorSchool} ${e.bachelorDept} → 碩士｜${e.masterSchool} ${e.masterDept}`;
}

function eduDiscipline(edu){
  const text=`${edu?.bachelorDept||""} ${edu?.masterDept||""} ${edu?.dept||""}`;
  if(/資工|資訊|計算機|人工智慧|AI|軟體/.test(text))return "CS";
  return "EE";
}

function routeFitsTier(route,edu){
  const job=JOBS.find(j=>j.id===route.jobId);
  if(!job)return false;
  return TIER_SCORE[edu.tier] >= TIER_SCORE[job.minTier];
}

function assignCareerByMajor(edu){
  const discipline=eduDiscipline(edu);
  let routes=(WORK_ROUTES[discipline]||[]).filter(r=>routeFitsTier(r,edu));

  // Lower-tier profiles still get a major-related route instead of a random unrelated job.
  if(!routes.length){
    routes=(WORK_ROUTES[discipline]||[]).filter(r=>{
      const job=JOBS.find(j=>j.id===r.jobId);
      return job && ["it","qa","process","fae"].includes(job.id);
    });
  }
  if(!routes.length)routes=WORK_ROUTES[discipline]||WORK_ROUTES.EE;

  const route=deep(rand(routes));
  const job=deep(JOBS.find(j=>j.id===route.jobId));
  const company=deep(COMPANIES.find(c=>c.name===route.company));

  return {
    discipline,
    department:route.department,
    job,
    company
  };
}

function jobFitsEdu(job,edu){
  return TIER_SCORE[edu.tier] >= TIER_SCORE[job.minTier];
}
function randomJobForEdu(edu){
  let pool=JOBS.filter(j=>jobFitsEdu(j,edu));
  if(!pool.length)pool=JOBS.filter(j=>j.minTier==="C"||j.minTier==="B");
  return deep(rand(pool));
}
function randomCompanyForJob(job){
  let pool=COMPANIES.filter(c=>c.jobs.includes(job.id));
  return deep(rand(pool));
}
function applyJobBonus(job,stats){
  Object.entries(job.bonus).forEach(([k,v])=>stats[k]=clamp(stats[k]+v));
}
function jobCompanyCard(job,company){
  return `<div class="jobCard"><b>${company.name}｜${job.name}</b><span>${job.desc}</span><span class="bonus">${company.note}</span></div>`;
}

function specialTriggerCandidates(){
  if(!state || state.ended)return [];
  return SPECIAL_EVENTS.filter(e=>{
    if(!e.phaseIds.includes(phase().id))return false;
    if(state.usedSpecial?.includes(e.id))return false;
    try{return !!e.trigger(state.stats)}catch(_){return false}
  });
}
function eventConditionsHTML(ev){
  if(!ev?.conditions)return "";
  return `<div class="conditionList">${ev.conditions.map(([label,fn])=>{
    let hit=false;try{hit=!!fn(state.stats)}catch(_){}
    return `<span class="conditionTag ${hit?"hit":""}">${label}</span>`;
  }).join("")}</div>`;
}
function ensureV2State(){
  if(!state)return;
  if(state.skillPoints===undefined)state.skillPoints=0;
  if(state.ended===undefined)state.ended=false;
  if(!Array.isArray(state.usedSpecial))state.usedSpecial=[];if(!Array.isArray(state.seenEvents))state.seenEvents=[];if(state.stageReward===undefined)state.stageReward=null;if(state.rolling===undefined)state.rolling=null;if(state.hospitalVisits===undefined)state.hospitalVisits=0;if(state.forcedNightShifts===undefined)state.forcedNightShifts=0;if(state.shareCard===undefined)state.shareCard="";ensureIncomeState();
}
function applySkillPoints(n){
  state.skillPoints=(state.skillPoints||0)+n;
}
function maybeTriggerEnding(ev,roll){
  // Extreme endings only happen on already-triggered high-risk special events.
  if(!ev?.possibleEnding || roll>2)return false;
  if(ev.possibleEnding==="lab_injury"){
    if(state.stats.health<=28 && roll===1){
      state.ended=true;
      state.ending={
        title:"住院後遭資遣",
        text:"實驗事故造成長期住院。等你恢復到可以回公司時，職位早已被重整，最後收到資遣通知。你的竹科生涯在一場實驗事故後提前結束。"
      };
      return true;
    }
  }
  if(ev.possibleEnding==="traffic_fatal"){
    if(state.stats.health<=25 && roll===1){
      state.ended=true;
      state.ending={
        title:"夜班通勤事故",
        text:"長期輪班與睡眠不足讓你的反應力降到危險程度。這一次通勤事故沒有等到第二次機會，你的工程師人生就此結束。"
      };
      return true;
    }
  }
  return false;
}

let state=null;
function clamp(n){return Math.max(0,Math.min(100,n))}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function deep(o){return JSON.parse(JSON.stringify(o))}
function ovr(s){return Math.round((s.tech*1.35+s.stress+s.health*.8+s.comm*.75+s.obedience*.55+s.slack*.35+s.luck*.5)/6.3)}
function save(){localStorage.setItem("engineerLifeV16",JSON.stringify(state))}
function load(){try{return JSON.parse(localStorage.getItem("engineerLifeV16")||"null")}catch(e){return null}}
function specialNameData(name){return NAMES.easter.find(x=>x.name===name)}
function randomName(){return Math.random()<.18?rand(NAMES.easter).name:rand(NAMES.normal)}
function randomEdu(){return randomEduV11()}
function applyNameBonus(name,stats){const d=specialNameData(name);if(!d)return {stats,note:"一般工程師：沒有隱藏加成"};Object.entries(d.bonus).forEach(([k,v])=>stats[k]=clamp(stats[k]+v));return {stats,note:d.note}}
function statLabel(k){return ({health:"健康度",obedience:"奴性",stress:"抗壓性",tech:"技術力",comm:"溝通力",slack:"摸魚力",luck:"運氣"})[k]}
function eduCard(e){
  const bonus=e.tier==="SS"
    ?"★ 10% 超稀有 SS：大學＋碩士皆頂級學府"
    :e.mixed
    ?"▲ 30% 混血學歷：私立大學 → 好國立碩士，會觸發專屬事件"

    ?"50% 國立體系：整體能力普通偏穩"
    :"10% 一般私立體系：低起點模式，前期更辛苦";
  return `<div class="educationCard">
    <b>${eduFullText(e)}</b>
    <span>背景：${e.eduType}｜等級 ${e.tier}｜技術 ${e.base.tech}｜抗壓 ${e.base.stress}</span>
    <span class="bonus">${bonus}</span>
  </div>`;
}
function previewStats(e,name){
  let stats=deep(e.base);
  let b=applyNameBonus(name,stats);
  return `<div class="startStats">${Object.keys(stats).map(k=>`<div class="startStat"><b>${stats[k]}</b><span>${statLabel(k)}</span></div>`).join("")}</div><p class="note" style="margin-top:10px;color:var(--yellow)">${b.note}</p>`;
}
function previewStatsV4(e,name,job){
  let stats=deep(e.base);
  let b=applyNameBonus(name,stats);
  applyJobBonus(job,stats);
  return `<div class="startStats">${Object.keys(stats).map(k=>`<div class="startStat"><b>${stats[k]}</b><span>${statLabel(k)}</span></div>`).join("")}</div><p class="note" style="margin-top:10px;color:var(--yellow)">${b.note}｜${job.name} 職系加成已套用</p>`;
}

}function currentDraftName(){
  const el=document.getElementById("nameInput");
  return (el?.value||"").trim();
}

function refreshDraftPreview(){
  const e=window._draftEdu||randomEdu();
  const a=window._draftAvatar||randomAvatar();
  const n=currentDraftName()||"未命名工程師";

  const eduEl=document.getElementById("eduCard");
  const statEl=document.getElementById("previewStats");
  const nameEl=document.getElementById("previewName");
  const avatarEl=document.getElementById("previewAvatar");
  const previewJobEl=document.getElementById("previewJob");

  if(eduEl)eduEl.innerHTML=eduCard(e);
  if(statEl)statEl.innerHTML=previewStats(e,n);
  if(nameEl)nameEl.textContent=n;
  if(avatarEl)avatarEl.src=a;
  if(previewJobEl)previewJobEl.textContent="公司／部門／職位：ENTER 後揭曉";
}

function rerollEdu(){
  window._draftEdu=randomEdu();
  window._draftAvatar=randomAvatar();
  refreshDraftPreview();
}

function startGame(){
  const name=currentDraftName();
  if(!name){
    alert("先輸入你的名字，工程師不能連工號主人都沒有。");
    document.getElementById("nameInput")?.focus();
    return;
  }

  const edu=window._draftEdu||randomEdu();
  const avatar=window._draftAvatar||randomAvatar();

  // Company, department and role are revealed only after ENTER,
  // and are constrained by the player's major.
  const career=assignCareerByMajor(edu);
  const job=career.job;
  const company=career.company;
  const department=career.department;

  let stats=deep(edu.base);
  applyJobBonus(job,stats);

  const salary=Math.round(job.salary*company.salaryMul/1000)*1000;

  state={
    name,edu,job,company,department,
    discipline:career.discipline,
    avatar,stats,
    phase:0,turn:0,year:2026,age:24,
    salary,jobTitle:job.name,
    skillPoints:0,ended:false,ending:null,
    current:null,result:null,prologue:true,stageReward:null,rolling:null,
    logs:[{
      when:"2026・24歲",
      text:`${eduFullText(edu)}畢業，進入 ${company.name}｜${department} 擔任 ${job.name}。`
    }],
    used:[],usedSpecial:[],seenEvents:[],
    hospitalVisits:0,forcedNightShifts:0,shareCard:"",
    salaryHistory:[{year:2026,salary:salary*14,monthly:salary,reason:"入職"}],
    totalCareerIncome:salary*14
  };

  save();
  render();
}

function phase(){
  return PHASES[state.phase];
}
function timeline(){
  return PHASES.map((p,i)=>`
    <div class="node ${i<state.phase?"done":i===state.phase?"current":""}">
      <i class="dot"></i>
      <div><b>${p.year}｜${p.name}</b><br><span>${p.story}</span></div>
    </div>`).join("");
}
function statBlock(){
  return Object.keys(state.stats).map(k=>`
    <div class="stat">
      <div class="statHead"><span>${statLabel(k)}</span><b>${state.stats[k]}</b></div>
      <div class="bar"><i style="width:${state.stats[k]}%"></i></div>
    </div>`).join("");
}

function countHospitalVisit(ev,roll){
  if(!ev)return;
  const healthIds=["health_faint_office","health_er","health_hospitalization"];
  if(healthIds.includes(ev.id)){
    // Any health-risk event reaching a bad roll counts as an ER/hospital visit.
    // Choosing explicit hospital/ER options also counts.
    if(roll<=4){
      state.hospitalVisits=(state.hospitalVisits||0)+1;
    }
  }
  if(ev.id==="obedience_graveyard_shift"){
    state.forcedNightShifts=(state.forcedNightShifts||0)+1;
  }
}
function checkHospitalEnding(){
  if((state.hospitalVisits||0)>=3 && !state.ended){
    recordAnnualIncome("健康崩潰結算");
    state.ended=true;
    state.ending={
      title:"三進醫院後，身體徹底撐不住",
      nick:"急診常客",
      good:false,
      text:"你把每一次昏倒、急診和住院都當成『休息一下就好』。第三次進醫院後，醫師直接要求你停止目前的工作型態。你的科技業生涯不是被主管結束，而是身體先宣布離職。"
    };
    state.current=null;
    state.result=null;
    state.rolling=null;
    state.logs.unshift({when:`${state.year}・${state.age}歲`,text:"累積進出醫院 3 次，觸發悲慘結局。"});
    save();render();
    return true;
  }
  return false;
}

function drawEvent(){
  if(!state || state.current || state.result || state.ended || state.prologue || state.stageReward)return;
  ensureV2State();
  if(!Array.isArray(state.seenEvents))state.seenEvents=[];

  if(checkHospitalEnding())return;

  // Health under 60 activates random medical-risk events.
  const healthRisk=HEALTH_RISK_EVENTS.filter(e=>e.trigger(state.stats) && !state.seenEvents.includes(e.title));
  if(healthRisk.length && Math.random()<0.34){
    const ev=deep(rand(healthRisk));
    ev.isSpecial=true;
    ev.eventType="⚠ 健康風險事件";
    state.seenEvents.push(ev.title);
    state.current=ev;
    save();render();return;
  }

  // Excessive obedience creates exploitation events.
  const obedienceRisk=OBEDIENCE_EVENTS.filter(e=>e.trigger(state.stats) && !state.seenEvents.includes(e.title));
  if(obedienceRisk.length && Math.random()<0.32){
    const ev=deep(rand(obedienceRisk));
    ev.isSpecial=true;
    ev.eventType="⚠ 奴性觸發事件";
    state.seenEvents.push(ev.title);
    state.current=ev;
    save();render();return;
  }

  const rareAvailable=RARE_GROWTH_EVENTS.filter(e=>!state.seenEvents.includes(e.title));
  if(rareAvailable.length && Math.random()<0.12){
    const ev=deep(rand(rareAvailable));
    ev.eventType="★ 稀有成長事件";
    ev.isRareGrowth=true;
    state.seenEvents.push(ev.title);
    state.current=ev;
    save();render();return;
  }

  const specials=specialTriggerCandidates().filter(e=>!state.seenEvents.includes(e.title));
  if(specials.length){
    const mixed=specials.filter(e=>e.id==="mixed_education_shaming");
    const pool=mixed.length?mixed:specials;
    if(Math.random()<0.58){
      const ev=deep(rand(pool));
      state.usedSpecial.push(ev.id);
      state.seenEvents.push(ev.title);
      ev.isSpecial=true;
      state.current=ev;
      save();render();return;
    }
  }

  const jobPool=(JOB_EVENTS[state.job?.id]||[]);
  const pools=[jobPool,COMMON_DETAIL_EVENTS,MORE_DIVERSE_EVENTS,EVENTS[phase().id]||EVENTS.entry];
  const candidates=[];
  pools.forEach((pool,idx)=>{
    pool.forEach(e=>{
      if(!state.seenEvents.includes(e.title))candidates.push({e,idx});
    });
  });

  if(!candidates.length){
    finishCareer();
    return;
  }

  const pick=rand(candidates);
  const ev=deep(pick.e);
  ev.eventType=pick.idx===0?"職系專屬事件":pick.idx===1?"公司荒謬事件":pick.idx===2?"人生雜事事件":"一般職場事件";
  state.seenEvents.push(ev.title);
  state.current=ev;
  save();render();
}
function applyEventFx(ev,ch,deltas){
  const isRare=RARE_GROWTH_EVENTS.some(x=>x.title===ev.title);
  const isSpecial=!!ev.isSpecial;
  ch.fx.forEach(([k,v])=>{
    let applied=v;
    if(!isRare && !isSpecial && v>0){
      // Ordinary work events should not farm stats.
      applied=Math.min(v,2);
    }
    state.stats[k]=clamp(state.stats[k]+applied);
    deltas.push(`${statLabel(k)} ${applied>=0?"+":""}${applied}`);
  });
}

function choose(i){
  beginDiceRoll(i);
}
function nextTurn(){
  state.result=null;
  state.turn++;
  if(state.turn>=phase().turns){
    const finished=phase();
    recordAnnualIncome(`${finished.name} 結算`);

    if(state.phase>=PHASES.length-1){
      finishCareer();
      return;
    }

    const points=1+Math.floor(Math.random()*3); // lower reward: 1–3
    state.skillPoints=(state.skillPoints||0)+points;
    state.stageReward={phaseName:finished.name,story:finished.story,awarded:points};
    state.logs.unshift({
      when:`${state.year}・${state.age}歲`,
      text:`撐過 ${finished.name} 三回合，獲得 ${points} 點自由能力點。`
    });

    state.phase++;
    state.turn=0;
    state.year=phase().year;
    state.age=phase().age;

    // Salary growth varies slightly rather than fixed huge jumps.
    const raisePct=0.06+Math.random()*0.10;
    state.salary=Math.round(state.salary*(1+raisePct)/1000)*1000;
    state.used=[];
  }
  save();render();
}
function resetGame(){if(confirm("確定要重開工程師人生？")){localStorage.removeItem("engineerLifeV16");state=null;render()}}


function v7PointCost(k){return k==="health"?3:2}
function spendStagePoint(k){
  const cost=v7PointCost(k);
  if((state.skillPoints||0)<cost || state.stats[k]>=100)return;
  state.skillPoints-=cost;
  state.stats[k]=clamp(state.stats[k]+1);
  save();render();
}
function finishStageReward(){
  state.stageReward=null;
  save();render();
}
function stageRewardCard(){

      <button ${state.skillPoints<cost||state.stats[k]>=100?"disabled":""} onclick="spendStagePoint('${k}')">＋1</button>

  </div>`;
}



function ensureIncomeState(){
  if(!state)return;
  if(!Array.isArray(state.salaryHistory)){
    state.salaryHistory=[{year:state.year||2026,salary:(state.salary||0)*14,monthly:state.salary||0,reason:"入職"}];
  }
  if(state.totalCareerIncome===undefined){
    state.totalCareerIncome=state.salaryHistory.reduce((a,x)=>a+(x.salary||0),0);
  }
}
function annualSalaryForYear(){
  // Assume 14 months total comp as a simple tech-industry baseline.
  return Math.round((state.salary||0)*14);
}
function recordAnnualIncome(reason="年度結算"){
  ensureIncomeState();
  const annual=annualSalaryForYear();
  const existing=state.salaryHistory.find(x=>x.year===state.year);
  if(existing){
    existing.salary=annual;
    existing.monthly=state.salary;
    existing.reason=reason;
  }else{
    state.salaryHistory.push({year:state.year,salary:annual,monthly:state.salary,reason});
    state.totalCareerIncome+=annual;
  }
}
function salaryHistoryHTML(){
  ensureIncomeState();
  return `<div class="moneyHero">
    <div><b>NT$ ${annualSalaryForYear().toLocaleString()}</b><span>目前年薪估算</span></div>
    <div><b>NT$ ${state.totalCareerIncome.toLocaleString()}</b><span>生涯累積收入</span></div>
  </div>
  <table class="salaryTable"><thead><tr><th>年份</th><th>月薪</th><th>年薪</th></tr></thead><tbody>
    ${state.salaryHistory.map(x=>`<tr><td>${x.year}</td><td>${x.monthly.toLocaleString()}</td><td><b>${x.salary.toLocaleString()}</b></td></tr>`).join("")}
  </tbody></table>`;
}

function careerNickname(){
  if(state.ending?.nick)return state.ending.nick;
  const s=state.stats;
  if(state.ending?.title?.includes("夜班"))return "夜班亡魂";
  if(state.ending?.title?.includes("資遣"))return "被資遣的勇者";
  if(s.health<=25)return "爆肝王";
  if(s.obedience>=85 && s.stress<=55)return "KPI 奴隸";
  if(s.slack>=82)return "摸魚宗師";
  if(s.tech>=90)return "Debug 狂魔";
  if(s.comm>=85)return "會議生存王";
  if(s.stress>=88 && s.health>=60)return "竹科不死鳥";
  if(s.obedience>=78 && s.comm<=55)return "背鍋俠";
  if(state.edu?.mixed && s.tech>=82 && s.stress>=75)return "洗學歷逆襲王";
  if(s.luck>=85)return "天選工程師";
  if(s.health>=85)return "養生工程師";
  return "竹科生存者";
}

function drawRadar(){
  const canvas=document.getElementById("abilityRadar");if(!canvas)return;
  const ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,R=108;
  const keys=["health","obedience","stress","tech","comm","slack","luck"];
  const labels=keys.map(statLabel),n=keys.length;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#244b52";ctx.fillStyle="#84aaa1";ctx.font="10px monospace";
  for(let ring=1;ring<=5;ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+i*Math.PI*2/n,r=R*ring/5,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.stroke();
  }
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*Math.PI*2/n,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke();
    const tx=cx+Math.cos(a)*(R+22),ty=cy+Math.sin(a)*(R+22);
    ctx.textAlign=Math.cos(a)>.2?"left":Math.cos(a)<-.2?"right":"center";
    ctx.textBaseline=Math.sin(a)>.2?"top":Math.sin(a)<-.2?"bottom":"middle";
    ctx.fillText(labels[i],tx,ty);
  }
  ctx.beginPath();
  keys.forEach((k,i)=>{
    const a=-Math.PI/2+i*Math.PI*2/n,r=R*(state.stats[k]/100),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.closePath();ctx.fillStyle="rgba(0,255,160,.18)";ctx.fill();ctx.strokeStyle="#00ffa0";ctx.lineWidth=2;ctx.stroke();
}



function loadImg(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}
function roundedRect(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}
}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,color){
  const words=(text||'').split(' '); let line=''; const lines=[];
  for(let i=0;i<words.length;i++){
    const test=line?line+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=words[i];}
    else line=test;
  }
  if(line)lines.push(line);
  ctx.fillStyle=color||'#d7e6ff';
  lines.forEach((ln,idx)=>ctx.fillText(ln,x,y+idx*lineHeight));
  return y+lines.length*lineHeight;
}
function multilineByChars(ctx,text,x,y,maxChars,lineHeight,color){
  const arr=[]; let t='';
  [...(text||'')].forEach(ch=>{ t+=ch; if(t.length>=maxChars){arr.push(t); t='';}});
  if(t)arr.push(t);
  ctx.fillStyle=color||'#d7e6ff';
  arr.forEach((ln,idx)=>ctx.fillText(ln,x,y+idx*lineHeight));
  return y+arr.length*lineHeight;
}
function drawShareRadar(ctx,cx,cy,R){
  const keys=["health","obedience","stress","tech","comm","slack","luck"];
  const labels=["健康","奴性","抗壓","技術","溝通","摸魚","運氣"];
  const n=keys.length;
  ctx.lineWidth=2;
  for(let ring=1;ring<=4;ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+i*Math.PI*2/n,r=R*ring/4,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.strokeStyle='rgba(122,150,210,.28)';ctx.stroke();
  }
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*Math.PI*2/n,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle='rgba(122,150,210,.24)';ctx.stroke();
    const tx=cx+Math.cos(a)*(R+24),ty=cy+Math.sin(a)*(R+24);
    ctx.fillStyle='#d9e7ff';ctx.font='bold 22px Arial';
    ctx.textAlign=Math.cos(a)>.2?'left':Math.cos(a)<-.2?'right':'center';
    ctx.textBaseline=Math.sin(a)>.2?'top':Math.sin(a)<-.2?'bottom':'middle';
    ctx.fillText(labels[i],tx,ty);
  }
  ctx.beginPath();
  keys.forEach((k,i)=>{
    const a=-Math.PI/2+i*Math.PI*2/n,r=R*((state.stats[k]||0)/100),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle='rgba(255,108,46,.22)';ctx.fill();
  ctx.strokeStyle='#ff6d2e';ctx.lineWidth=5;ctx.stroke();
}

function endingRarity(){
  if(!state?.ending)return 'R';
  if(state.ending.good){
    if(['財富自由，主動離開竹科','技術大神，升到傳說級職位','跳出去創業成功'].includes(state.ending.title))return 'SSR';
    return 'SR';
  }
  if(['爆肝累死','夜班通勤事故','實驗事故後被資遣'].includes(state.ending.title))return 'SR';
  return 'R';
}
function burnoutIndex(){
  const s=state.stats||{};
  const v=(100-(s.health||0))*0.45 + (s.obedience||0)*0.25 + (100-(s.stress||0))*0.20 + (state.hospitalVisits||0)*7 + (state.forcedNightShifts||0)*4;
  return Math.max(0,Math.min(100,Math.round(v)));
}
function survivalRate(){
  const s=state.stats||{};
  const v=(s.health||0)*0.45 + (s.stress||0)*0.25 + (100-(s.obedience||0))*0.12 + (s.luck||0)*0.18 - (state.hospitalVisits||0)*8;
  return Math.max(1,Math.min(99,Math.round(v)));
}
function companyBadge(){
  const n=state?.company?.name||'竹科';
  if(n.includes('台機'))return '晶圓帝國';
  if(n.includes('輝'))return 'AI 神殿';
  if(n.includes('聯發'))return 'IC 江湖';
  if(n.includes('鴻'))return '工業巨獸';
  if(n.includes('日月'))return '封測宇宙';
  if(n.includes('合座'))return '外商副本';
  return '科技大廠';
}
function rarityLabel(){
  const r=endingRarity();
  return r==='SSR'?'SSR 傳說結局':r==='SR'?'SR 稀有結局':'R 一般結局';
}

async function ensureShareCard(){
  if(state?.shareCard)return state.shareCard;
  const data=await generateShareCardDataURL();
  state.shareCard=data; save();
  return data;
}
async function downloadShareCard(){
  const data=await ensureShareCard();
  const a=document.createElement('a');
  a.href=data; a.download=`engineer-life-${(state.name||'share')}.png`;
  document.body.appendChild(a); a.click(); a.remove();
}
async function shareToInstagram(){
  if(!state?.ended){ alert('結局後才能分享。'); return; }
  const data=await ensureShareCard();
  if(!navigator.share){
    await downloadShareCard();
    alert('你的瀏覽器不支援直接分享，已先幫你下載分享圖，可再手動分享到 Instagram。');
    return;
  }
  const res=await fetch(data); const blob=await res.blob();
  const file=new File([blob],`engineer-life-${(state.name||'share')}.png`,{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:'Engineer Life',text:`${state.name} 的工程師人生結局：${state.ending?.title||''}｜頭銜：${careerNickname()}`});
    }catch(e){}
  }else{
    await downloadShareCard();
    alert('目前裝置無法直接把圖片丟到分享面板，已幫你下載分享圖。');
  }
}

function chooseEnding(){
  ensureIncomeState();
  // Target distribution: 20% good / 80% bad.
  const isGood=Math.random()<0.20;
  let pool=isGood?GOOD_ENDINGS:BAD_ENDINGS;
  let eligible=pool.filter(e=>{
    try{return e.cond(state)}catch(_){return false}
  });
  if(!eligible.length){
    eligible=isGood?[{
      title:"平安退休",
      nick:"竹科倖存者",
      text:"你沒有成為傳奇，但也沒有被竹科吞掉。能健康走出來，本身就已經是少數成就。"
    }]:BAD_ENDINGS.filter(e=>e.title==="普通地被磨光");
  }
  return deep(rand(eligible));
}
function finishCareer(){
  if(state.ended)return;
  recordAnnualIncome("生涯最終結算");
  const e=chooseEnding();
  state.ended=true;
  state.ending={title:e.title,text:e.text,nick:e.nick,good:GOOD_ENDINGS.some(x=>x.title===e.title)};
  state.current=null;state.result=null;state.stageReward=null;
  state.logs.unshift({when:`${state.year}・${state.age}歲`,text:`生涯結局：${e.title}`});
  save();render();
}

    return `<div class="box ${state.result.ended?"endingBox":""}"><div class="boxTitle">${state.result.isSpecial?"特殊事件結果":"命運骰結果"} <span>RESULT</span></div><div class="outcomeBadge ${state.result.tier==="good"?"good":"bad"}">${state.result.tier==="good"?"✓ 好結果｜骰到 5 以上":"✕ 壞結果｜骰到 1～4"}</div><div class="resultDice">${state.result.roll}</div><div class="resultText">${state.result.text}</div><div class="deltaRow">${state.result.deltas.map(x=>`<span class="delta ${x.includes("特殊事件點數")?"skillPoint":x.includes("+")?"good":"bad"}">${x}</span>`).join("")}</div>${state.result.ended?"":`<button class="primary" style="margin-top:12px" onclick="nextTurn()">繼續下一回合 →</button>`}</div>`;
  }
  return `<div class="box event"><div class="kicker">CURRENT CHAPTER · ${phase().name}</div><h2>${state.turn+1} / ${phase().turns} 回合</h2><p>${phase().desc}</p><p class="note" style="margin-top:9px">條件式特殊事件會根據能力值觸發。健康度是最重要的生存能力；健康過低時，加班、實驗、輪班等事件會變得更危險。</p></div><button class="primary" onclick="drawEvent()">開始本回合事件 →</button>`;
}
function render(){const app=document.getElementById("app");if(!state){state=load();if(!state){app.innerHTML=startScreen();return}}ensureV2State();app.innerHTML=`<div class="topbar"><div class="logo"><div class="chip">EL</div>Engineer Life</div><div style="display:flex;align-items:center;gap:8px"><div class="topmeta">PTT/BBS MODE · ${state.year} · ${state.age}歲 · ${state.jobTitle}</div><div class="menuWrap"><button class="menuBtn" onclick="openMenu()">☰ 選單</button></div></div></div><div class="shell"><aside class="left"><div class="box identity"><div class="boxTitle">USER PROFILE <span>#${Math.floor(1000+Math.random()*8999)}</span></div><div class="profileGrid"><div class="profileAvatar"><img src="${state?.avatar||ENGINEER_AVATAR}"></div><div><h1>${state.name}</h1><div class="sub">${state.edu.bachelorSchool} ${state.edu.bachelorDept}<br>碩士：${state.edu.masterSchool} ${state.edu.masterDept}｜${state.company?.name||"竹科"}｜${state.department||"技術部"}｜${state.job?.name||state.jobTitle}</div></div></div><div class="tagrow"><span class="tag gold">${state.jobTitle}</span><span class="tag">${state.company?.name||"竹科"}</span><span class="tag">月薪 ${state.salary.toLocaleString()}</span></div></div><div class="box timeline"><div class="boxTitle">CAREER PATH <span>生涯路線</span></div>${timeline()}</div><button class="primary" onclick="save()">儲存</button><button class="primary" style="margin-top:8px;border-color:var(--red);color:var(--red);background:#201014" onclick="resetGame()">重開人生</button></aside><main class="center"><div class="metrics" style="grid-template-columns:repeat(6,minmax(0,1fr))"><div class="metric"><b>${state.age}</b><span>年齡</span></div><div class="metric"><b>${state.year}</b><span>年份</span></div><div class="metric"><b>${ovr(state.stats)}</b><span>綜合 OVR</span></div><div class="metric"><b>${state.salary.toLocaleString()}</b><span>月薪</span></div><div class="metric"><b>${state.skillPoints}</b><span>特殊事件點數</span></div><div class="metric"><b>${state.turn}/${phase().turns}</b><span>階段回合</span></div></div><div style="height:12px"></div>${centerCard()}<div class="box"><div class="boxTitle">RECENT LOG <span>最近紀錄</span></div>${state.logs.slice(0,7).map(l=>`<div class="log"><small>${l.when}</small><div>${l.text}</div></div>`).join("")}</div></main><aside class="right"><div class="box"><div class="boxTitle">BASIC STATS <span>能力值</span></div>${statBlock()}</div><div class="box"><div class="boxTitle">SYSTEM NOTE <span>V18</span></div><p class="note">V19：開局只骰學歷。按 ENTER 後才依大學／碩士科系自動分配合理的公司、部門與職位；電機電子與資工走不同職涯池。</p></div></aside></div>`}
render();
</script>

<script id="v3-responsive-js">
function v3MobileProfile(){
  if(!state)return "";
  return `<div class="mobileProfile">
    <div class="box identity">
      <div class="boxTitle">USER PROFILE <span>${state.edu.tier} 級學歷</span></div>
      <div class="profileGrid"><div class="profileAvatar"><img src="${state?.avatar||ENGINEER_AVATAR}"></div><div><h1>${state.name}</h1><div class="sub">${state.edu.bachelorSchool} ${state.edu.bachelorDept}<br>碩士：${state.edu.masterSchool} ${state.edu.masterDept}｜${state.company?.name||"竹科"}｜${state.department||"技術部"}｜${state.job?.name||state.jobTitle}</div></div></div>
      <div class="tagrow">
        <span class="tag gold">${state.jobTitle}</span>
        <span class="tag">竹科</span>
        <span class="tag">月薪 ${state.salary.toLocaleString()}</span>
      </div>
    </div>
  </div>`;
}

const V3_prevRender=render;
render=function(){
  V3_prevRender();
  if(!state)return;

  const center=document.querySelector(".center");
  if(center && !center.querySelector(".mobileProfile")){
    center.insertAdjacentHTML("afterbegin",v3MobileProfile());
  }
};
</script>


<script id="v19-name-ui">
document.addEventListener("input",(e)=>{
  if(e.target && e.target.id==="nameInput"){
    const name=e.target.value.trim()||"未命名工程師";
    const nameEl=document.getElementById("previewName");
    const statEl=document.getElementById("previewStats");
    if(nameEl)nameEl.textContent=name;
    if(statEl && window._draftEdu){
      statEl.innerHTML=previewStats(window._draftEdu,name);
    }
  }
});
</script>


<script id="v6-runtime-guard">
window.addEventListener("error",(e)=>{
  console.error("Engineer Life runtime error:",e.error||e.message);
  const app=document.getElementById("app");
  if(app && !document.getElementById("runtimeErrorBox")){
    app.insertAdjacentHTML("afterbegin",`
      <div id="runtimeErrorBox" style="position:relative;z-index:9999;margin:10px;padding:12px;border:1px solid #ff5d73;background:#240d13;color:#ffd6dc;font:12px/1.6 monospace">
        ⚠ 遊戲執行錯誤：${String(e.message||"unknown error")}
      </div>`);
  }
});
</script>


<script id="v8-footer-js">
function v8Footer(){
  return `<div class="siteFooter">ENGINEER LIFE · VERSION <b>V19.0</b> · <span class="credit">CREDIT BY RIVER</span></div>`;
}
const V8_prevRender=render;
render=function(){
  V8_prevRender();
  const app=document.getElementById("app");
  if(app && !app.querySelector(".siteFooter")){
    app.insertAdjacentHTML("beforeend",v8Footer());
  }
};
</script>

</body>
</html>
