<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Engineer Life V6 · ENTER 完整除錯版</title>
<meta name="theme-color" content="#02070a">
<style>
:root{--bg:#02070a;--panel:#061014;--panel2:#08181d;--line:#123b43;--green:#00ffa0;--cyan:#00d9ff;--yellow:#ffd166;--red:#ff5d73;--text:#d9f7ee;--muted:#6f9b92}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Courier New",monospace;min-height:100%}
body{background:linear-gradient(rgba(0,255,160,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,217,255,.02) 1px,transparent 1px),var(--bg);background-size:24px 24px}
button,input{font:inherit}button{cursor:pointer}#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(2,7,10,.96)}
.logo{display:flex;align-items:center;gap:9px;font-weight:1000;color:var(--green);letter-spacing:.08em}
.chip{width:26px;height:26px;border:2px solid var(--green);display:grid;place-items:center;color:var(--cyan);font-size:12px}
.topmeta{font-size:11px;color:var(--muted)}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr) 330px;min-height:calc(100vh - 49px)}
.left,.right{padding:14px;background:rgba(3,12,15,.86)}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.center{padding:18px;min-width:0}
.box{border:1px solid var(--line);background:linear-gradient(180deg,rgba(8,24,29,.96),rgba(4,14,18,.96));border-radius:6px;padding:14px;margin-bottom:12px}
.boxTitle{display:flex;justify-content:space-between;gap:10px;color:var(--green);font-weight:1000;font-size:12px;letter-spacing:.12em;margin-bottom:10px}.boxTitle span{color:var(--muted);font-weight:700}
.identity h1{font-size:30px;margin:4px 0 8px;color:#fff}.identity .sub{font-size:12px;line-height:1.7;color:#98c5b8}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{border:1px solid var(--line);color:#a8cfc4;border-radius:3px;padding:4px 6px;font-size:10px}.tag.gold{border-color:#695b2b;color:var(--yellow)}
.stat{margin-bottom:10px}.statHead{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}.statHead b{color:var(--yellow)}
.bar{height:7px;background:#102329;border-radius:99px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--green),var(--cyan));width:50%}
.timeline .node{display:flex;gap:10px;padding:8px 0;color:#63867f;font-size:11px}.timeline .dot{width:9px;height:9px;border:1px solid #31534c;border-radius:50%;margin-top:2px;flex:none}
.timeline .done,.timeline .current{color:#d6eee7}.timeline .done .dot{background:#2a7560;border-color:#2a7560}.timeline .current .dot{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 8px rgba(255,209,102,.5)}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.metric{border:1px solid var(--line);background:#07161a;padding:10px;border-radius:5px;text-align:center}
.metric b{display:block;color:var(--yellow);font-size:20px}.metric span{font-size:9px;color:var(--muted)}
.event h2{font-size:24px;margin:3px 0 10px;color:#fff;line-height:1.3}.event p{color:#b7d7ce;line-height:1.9;margin:0}
.kicker{font-size:10px;color:var(--cyan);letter-spacing:.12em;font-weight:900}
.choice{width:100%;text-align:left;background:#07191d;color:#e8fff7;border:1px solid #24545a;border-radius:5px;padding:12px;margin-bottom:8px}.choice:hover{border-color:var(--green)}
.choice b{display:block;font-size:14px}.choice span{display:block;font-size:11px;color:#8cb7ad;margin-top:4px}.choice em{display:block;font-size:9px;color:var(--yellow);font-style:normal;margin-top:5px}
.primary{width:100%;min-height:48px;border:1px solid var(--green);background:#0b2a22;color:var(--green);font-weight:1000;border-radius:5px}
.log{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed #14343a;font-size:11px}.log small{color:#5e8e84}.log div{color:#b9d7cf}
.startWrap{max-width:1100px;margin:0 auto;padding:34px 18px 50px}.hero{border:1px solid var(--line);padding:22px;background:rgba(4,16,20,.94);margin-bottom:14px}
.hero .ascii{white-space:pre;overflow:auto;color:var(--green);font-size:12px;line-height:1.05}.hero h1{font-size:38px;margin:12px 0 8px;color:#fff}.hero p{line-height:1.9;color:#afcdc5;max-width:900px}
.setupGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:12px}.field label{display:block;font-size:10px;color:var(--cyan);margin-bottom:6px}
.field input{width:100%;background:#02090c;color:#ecfff8;border:1px solid #23505a;border-radius:4px;padding:10px}.inline{display:grid;grid-template-columns:1fr auto;gap:8px}
.diceBtn{min-width:110px;border:1px solid var(--yellow);background:#211c0d;color:var(--yellow);border-radius:4px;font-weight:900}
.educationCard{border:1px solid #27515b;background:#06161b;padding:12px;border-radius:5px}.educationCard b{display:block;color:#fff;font-size:16px}.educationCard span{display:block;color:#7fa49c;font-size:11px;margin-top:4px;line-height:1.6}.bonus{margin-top:8px;color:var(--yellow)!important}
.startStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.startStat{border:1px solid #1a4449;background:#051316;padding:10px}.startStat b{display:block;color:var(--green);font-size:18px}.startStat span{font-size:9px;color:var(--muted)}
.resultDice{width:70px;height:70px;border:2px solid var(--yellow);display:grid;place-items:center;color:var(--yellow);font-size:34px;font-weight:1000;margin:10px auto}.resultText{line-height:1.85;color:#d0e8e1;font-size:12px}
.deltaRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.delta{border:1px solid #2d5a50;border-radius:3px;padding:4px 6px;font-size:9px;color:#b7d5cc}.delta.good{color:var(--green)}.delta.bad{color:var(--red)}.note{font-size:10px;color:#668b82;line-height:1.7}
@media(max-width:1050px){.shell{grid-template-columns:minmax(0,1fr) 300px}.left{display:none}}
@media(max-width:780px){.shell{display:block}.right{border-left:0;border-top:1px solid var(--line)}.center,.right{padding:10px}.setupGrid{grid-template-columns:1fr}.hero h1{font-size:30px}.startStats{grid-template-columns:repeat(2,1fr)}}
</style>

<style id="v2-special-css">
.specialWarn{
  display:inline-flex;align-items:center;gap:6px;
  margin-bottom:8px;padding:5px 8px;
  border:1px solid #6f3b45;border-radius:3px;
  background:#1b0c10;color:#ff8192;
  font-size:10px;font-weight:900;letter-spacing:.08em
}
.conditionList{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:10px
}
.conditionTag{
  border:1px solid #34565b;background:#07181c;
  color:#8bb6ad;padding:4px 6px;border-radius:3px;font-size:9px
}
.conditionTag.hit{border-color:#7c3f48;color:#ff8394;background:#1a0d11}
.skillPoint{
  color:#ffd166!important;border-color:#675c2e!important
}
.endingBox{
  border-color:#7d3f48!important;
  background:linear-gradient(180deg,#210e13,#0b1012)!important
}
.endingBox h2{color:#ff8b9a!important}
.endingBadge{
  display:inline-block;margin-bottom:10px;padding:5px 8px;
  border:1px solid #96515d;color:#ff9aaa;background:#281017;font-size:10px;font-weight:900
}
</style>


<style id="v3-responsive-css">
:root{
  --leftW:clamp(210px,16vw,250px);
  --rightW:clamp(290px,24vw,350px);
}
html{width:100%;min-width:0;-webkit-text-size-adjust:100%}
body{width:100%;max-width:100%;overflow-x:hidden}
*,*:before,*:after{box-sizing:border-box}
img,canvas,svg{max-width:100%}

.shell{
  grid-template-columns:var(--leftW) minmax(0,1fr) var(--rightW)!important;
  width:100%;
  max-width:1920px;
  margin:0 auto;
}
.left,.center,.right{min-width:0}
.center{overflow:hidden}
.metrics{grid-template-columns:repeat(6,minmax(0,1fr))!important}
.metric{min-width:0}
.metric b{font-size:clamp(16px,1.35vw,21px)}
.event h2{font-size:clamp(21px,1.8vw,27px)}
.event p,.resultText{font-size:clamp(12px,1vw,14px)}
.choice b{font-size:clamp(13px,1.05vw,15px)}
.choice{min-height:58px}
.primary{min-height:50px}
.startWrap{width:min(1120px,100%);padding-left:clamp(14px,3vw,28px);padding-right:clamp(14px,3vw,28px)}
.hero h1{font-size:clamp(31px,4vw,42px)}
.hero p{font-size:clamp(13px,1.1vw,15px)}

.mobileProfile{display:none}
.mobileStatsBlock{display:none}

/* laptop */
@media(max-width:1200px) and (min-width:901px){
  :root{--leftW:210px;--rightW:300px}
  .left,.right{padding:11px}
  .center{padding:14px}
  .metrics{gap:5px}
  .metric{padding:8px 3px}
  .identity h1{font-size:25px}
}

/* tablet */
@media(max-width:900px) and (min-width:701px){
  .shell{
    display:grid!important;
    grid-template-columns:minmax(0,1fr) 280px!important;
  }
  .left{display:none!important}
  .center{padding:12px}
  .right{padding:10px;border-left:1px solid var(--line)}
  .metrics{grid-template-columns:repeat(3,1fr)!important;gap:6px}
  .mobileProfile{
    display:block;
    margin-bottom:10px
  }
  .mobileProfile .box{margin-bottom:8px}
}

/* phone */
@media(max-width:700px){
  body{overflow-x:hidden!important;overflow-y:auto!important}
  .topbar{
    position:sticky;
    top:0;
    padding:8px 10px;
    z-index:40;
  }
  .logo{font-size:13px}
  .chip{width:23px;height:23px;font-size:10px}
  .topmeta{display:none}

  .shell{
    display:block!important;
    width:100%!important;
    min-height:auto!important;
  }
  .left{display:none!important}
  .center{
    width:100%;
    padding:8px!important;
    overflow:visible!important;
  }
  .right{
    width:100%;
    padding:8px!important;
    border-left:0!important;
    border-top:1px solid var(--line);
    background:rgba(3,12,15,.92);
  }

  .mobileProfile{
    display:block!important;
    margin-bottom:8px;
  }
  .mobileProfile .identity{
    margin-bottom:8px;
  }
  .mobileProfile .identity h1{
    font-size:24px;
  }
  .mobileProfile .tagrow{
    gap:4px;
  }

  .metrics{
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    gap:5px;
  }
  .metric{
    padding:7px 3px!important;
    min-height:57px;
  }
  .metric b{
    font-size:16px!important;
  }
  .metric span{
    font-size:8px!important;
    white-space:nowrap;
  }

  .box{
    padding:11px!important;
    margin-bottom:8px!important;
    border-radius:5px;
  }
  .boxTitle{
    font-size:10px!important;
    letter-spacing:.08em;
  }
  .event h2{
    font-size:20px!important;
    line-height:1.35;
  }
  .event p,.resultText{
    font-size:13px!important;
    line-height:1.75;
  }
  .kicker{font-size:9px}
  .choice{
    padding:11px!important;
    min-height:60px;
    touch-action:manipulation;
  }
  .choice b{font-size:14px!important}
  .choice span{font-size:11px!important;line-height:1.45}
  .choice em{font-size:9px!important}
  .primary{
    min-height:54px!important;
    font-size:14px;
    touch-action:manipulation;
  }
  .resultDice{
    width:62px;height:62px;font-size:28px;
  }
  .log{
    grid-template-columns:78px 1fr!important;
    gap:7px!important;
    font-size:10px!important;
  }
  .log small{font-size:9px}
  .conditionList{gap:4px}
  .conditionTag{font-size:8px;padding:3px 5px}
  .specialWarn{font-size:9px}

  /* right rail becomes a normal section at the bottom */
  .right .box:first-child{
    margin-top:0;
  }
  .stat{margin-bottom:8px}
  .statHead{font-size:10px}
  .bar{height:6px}

  /* start screen */
  .startWrap{
    width:100%;
    padding:18px 10px 28px!important;
  }
  .hero{
    padding:14px!important;
    margin-bottom:9px!important;
  }
  .hero .ascii{
    font-size:9px!important;
  }
  .hero h1{
    font-size:27px!important;
    line-height:1.15;
  }
  .hero p{
    font-size:13px!important;
    line-height:1.75;
  }
  .setupGrid{
    grid-template-columns:1fr!important;
    gap:8px!important;
  }
  .inline{
    grid-template-columns:1fr!important;
    gap:6px!important;
  }
  .diceBtn{
    width:100%!important;
    min-height:44px;
  }
  .startStats{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
  }
  .startStat{
    padding:9px!important;
  }
  .startStat b{font-size:17px!important}
  .educationCard b{font-size:14px}
}

/* very small phones */
@media(max-width:390px){
  .center,.right{padding-left:6px!important;padding-right:6px!important}
  .metrics{gap:4px}
  .metric{padding:6px 2px!important}
  .metric b{font-size:15px!important}
  .metric span{font-size:7.5px!important}
  .event h2{font-size:18px!important}
  .event p,.resultText{font-size:12.5px!important}
  .hero h1{font-size:24px!important}
}
</style>


<style id="v4-job-company-css">
.profileAvatar{
  width:82px;height:82px;flex:none;border:1px solid #2b5960;border-radius:5px;overflow:hidden;background:#0b1822
}
.profileAvatar img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.profileGrid{display:flex;gap:12px;align-items:center}
.jobCard{
  border:1px solid #285660;background:#06181d;padding:12px;border-radius:5px
}
.jobCard b{display:block;color:#fff;font-size:15px}
.jobCard span{display:block;color:#7fa69c;font-size:11px;line-height:1.6;margin-top:4px}
.jobCard .bonus{color:var(--yellow)!important}
.prologueCard{
  border-color:#2c6670!important;
  background:
    radial-gradient(circle at 90% 10%,rgba(0,217,255,.07),transparent 30%),
    linear-gradient(180deg,#081a20,#061116)!important
}
.prologueCard .quote{
  border-left:2px solid var(--yellow);padding:9px 11px;margin:10px 0 14px;background:#0b171a;color:#e7d797;font-size:12px;line-height:1.7
}
.prologueCard p{font-size:13px;line-height:1.9;color:#bdd7cf}
.prologueCard strong{color:var(--green)}
.prologueMeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.prologueMeta span{border:1px solid #28545b;padding:4px 6px;border-radius:3px;font-size:9px;color:#9cc6bb}
@media(max-width:700px){
  .profileAvatar{width:68px;height:68px}
  .profileGrid{align-items:flex-start}
  .prologueCard p{font-size:12.5px}
}
</style>

</head>

const TIER_SCORE={S:4,A:3,B:2,C:1,D:0};
function jobFitsEdu(job,edu){
  return TIER_SCORE[edu.tier] >= TIER_SCORE[job.minTier];
}
function randomJobForEdu(edu){
  let pool=JOBS.filter(j=>jobFitsEdu(j,edu));
  if(!pool.length)pool=JOBS.filter(j=>j.minTier==="C"||j.minTier==="B");
  return deep(rand(pool));
}
function randomCompanyForJob(job){
  let pool=COMPANIES.filter(c=>c.jobs.includes(job.id));
  return deep(rand(pool));
}
function applyJobBonus(job,stats){
  Object.entries(job.bonus).forEach(([k,v])=>stats[k]=clamp(stats[k]+v));
}
function jobCompanyCard(job,company){
  return `<div class="jobCard"><b>${company.name}｜${job.name}</b><span>${job.desc}</span><span class="bonus">${company.note}</span></div>`;
}

function specialTriggerCandidates(){
  if(!state || state.ended)return [];
  return SPECIAL_EVENTS.filter(e=>{
    if(!e.phaseIds.includes(phase().id))return false;
    if(state.usedSpecial?.includes(e.id))return false;
    try{return !!e.trigger(state.stats)}catch(_){return false}
  });
}
function eventConditionsHTML(ev){
  if(!ev?.conditions)return "";
  return `<div class="conditionList">${ev.conditions.map(([label,fn])=>{
    let hit=false;try{hit=!!fn(state.stats)}catch(_){}
    return `<span class="conditionTag ${hit?"hit":""}">${label}</span>`;
  }).join("")}</div>`;
}
function ensureV2State(){
  if(!state)return;
  if(state.skillPoints===undefined)state.skillPoints=0;
  if(state.ended===undefined)state.ended=false;
  if(!Array.isArray(state.usedSpecial))state.usedSpecial=[];
}
function applySkillPoints(n){
  state.skillPoints=(state.skillPoints||0)+n;
}
function maybeTriggerEnding(ev,roll){
  // Extreme endings only happen on already-triggered high-risk special events.
  if(!ev?.possibleEnding || roll>2)return false;
  if(ev.possibleEnding==="lab_injury"){
    if(state.stats.health<=28 && roll===1){
      state.ended=true;
      state.ending={
        title:"住院後遭資遣",
        text:"實驗事故造成長期住院。等你恢復到可以回公司時，職位早已被重整，最後收到資遣通知。你的竹科生涯在一場實驗事故後提前結束。"
      };
      return true;
    }
  }
  if(ev.possibleEnding==="traffic_fatal"){
    if(state.stats.health<=25 && roll===1){
      state.ended=true;
      state.ending={
        title:"夜班通勤事故",
        text:"長期輪班與睡眠不足讓你的反應力降到危險程度。這一次通勤事故沒有等到第二次機會，你的工程師人生就此結束。"
      };
      return true;
    }
  }
  return false;
}

let state=null;
function clamp(n){return Math.max(0,Math.min(100,n))}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function deep(o){return JSON.parse(JSON.stringify(o))}
function ovr(s){return Math.round((s.tech*1.35+s.stress+s.health*.8+s.comm*.75+s.obedience*.55+s.slack*.35+s.luck*.5)/6.3)}

function load(){try{return JSON.parse(localStorage.getItem("engineerLifeV6")||"null")}catch(e){return null}}
function specialNameData(name){return NAMES.easter.find(x=>x.name===name)}
function randomName(){return Math.random()<.18?rand(NAMES.easter).name:rand(NAMES.normal)}
function randomEdu(){return deep(rand(EDUCATION))}
function applyNameBonus(name,stats){const d=specialNameData(name);if(!d)return {stats,note:"一般工程師：沒有隱藏加成"};Object.entries(d.bonus).forEach(([k,v])=>stats[k]=clamp(stats[k]+v));return {stats,note:d.note}}
function statLabel(k){return ({health:"健康度",obedience:"奴性",stress:"抗壓性",tech:"技術力",comm:"溝通力",slack:"摸魚力",luck:"運氣"})[k]}
function eduCard(e){return `<div class="educationCard"><b>${e.school} ${e.dept}・${e.degree}</b><span>學歷等級 ${e.tier}｜初始技術 ${e.base.tech}｜抗壓 ${e.base.stress}</span><span class="bonus">${e.tier==="S"?"名校光環：技術／抗壓明顯加成":e.tier==="A"?"研究所實戰派：能力均衡":e.tier==="B"?"中段起跑：靠職場表現翻身":e.tier==="C"?"普通起跑：後續成長更重要":"低起點模式：真正的 hard mode"}</span></div>`}
function previewStats(e,name){
  let stats=deep(e.base);
  let b=applyNameBonus(name,stats);
  return `<div class="startStats">${Object.keys(stats).map(k=>`<div class="startStat"><b>${stats[k]}</b><span>${statLabel(k)}</span></div>`).join("")}</div><p class="note" style="margin-top:10px;color:var(--yellow)">${b.note}</p>`;
}
function previewStatsV4(e,name,job){
  let stats=deep(e.base);
  let b=applyNameBonus(name,stats);
  applyJobBonus(job,stats);
  return `<div class="startStats">${Object.keys(stats).map(k=>`<div class="startStat"><b>${stats[k]}</b><span>${statLabel(k)}</span></div>`).join("")}</div><p class="note" style="margin-top:10px;color:var(--yellow)">${b.note}｜${job.name} 職系加成已套用</p>`;
}

        <div style="display:flex;gap:12px;margin-bottom:12px;align-items:center"><div class="profileAvatar"><img src="${ENGINEER_AVATAR}"></div><div><b id="previewName" style="font-size:18px">${name}</b><div id="previewJob" style="font-size:11px;color:var(--muted);margin-top:5px">${company.name}｜${job.name}</div></div></div>
        <div id="previewStats">${previewStatsV4(edu,name,job)}</div>
        <button class="primary" style="margin-top:14px" onclick="startGame()">ENTER 竹科人生 →</button>
      </div>
    </div>
  </div>`;
}

function currentDraftName(){
  const el=document.getElementById("nameInput");
  return (el?.value||window._draftName||randomName()).trim();
}
function refreshDraftPreview(){
  const e=window._draftEdu||randomEdu();
  const j=window._draftJob||randomJobForEdu(e);
  const c=window._draftCompany||randomCompanyForJob(j);
  const n=currentDraftName();

  const eduEl=document.getElementById("eduCard");
  const jobEl=document.getElementById("jobCompanyCard");
  const statEl=document.getElementById("previewStats");
  const nameEl=document.getElementById("previewName");
  const previewJobEl=document.getElementById("previewJob");

  if(eduEl)eduEl.innerHTML=eduCard(e);
  if(jobEl)jobEl.innerHTML=jobCompanyCard(j,c);
  if(statEl)statEl.innerHTML=previewStatsV4(e,n,j);
  if(nameEl)nameEl.textContent=n;
  if(previewJobEl)previewJobEl.textContent=`${c.name}｜${j.name}`;
}
function rerollName(){
  const n=randomName();
  window._draftName=n;
  const input=document.getElementById("nameInput");
  if(input)input.value=n;
  refreshDraftPreview();
}
function rerollEdu(){
  const e=randomEdu();
  const j=randomJobForEdu(e);
  const c=randomCompanyForJob(j);
  window._draftEdu=e;
  window._draftJob=j;
  window._draftCompany=c;
  refreshDraftPreview();
}
function rerollJobCompany(){
  const e=window._draftEdu||randomEdu();
  const j=randomJobForEdu(e);
  const c=randomCompanyForJob(j);
  window._draftJob=j;
  window._draftCompany=c;
  refreshDraftPreview();
}
function startGame(){
  const name=currentDraftName();
  const edu=window._draftEdu||randomEdu();
  const job=window._draftJob||randomJobForEdu(edu);
  const company=window._draftCompany||randomCompanyForJob(job);

  let stats=deep(edu.base);
  const nameBonus=applyNameBonus(name,stats);
  applyJobBonus(job,stats);

  const salary=Math.round(job.salary*company.salaryMul/1000)*1000;
  state={
    name,edu,job,company,stats,
    phase:0,turn:0,year:2026,age:24,
    salary,jobTitle:job.name,
    skillPoints:0,ended:false,ending:null,
    current:null,result:null,prologue:true,
    logs:[{
      when:"2026・24歲",
      text:`${edu.school} ${edu.dept} ${edu.degree}畢業，進入 ${company.name} 擔任 ${job.name}。${nameBonus.note}`
    }],
    used:[],usedSpecial:[]
  };
  save();
  render();
}


function phase(){
  return PHASES[state.phase];
}
function timeline(){
  return PHASES.map((p,i)=>`
    <div class="node ${i<state.phase?"done":i===state.phase?"current":""}">
      <i class="dot"></i>
      <div><b>${p.year}｜${p.name}</b><br><span>${p.story}</span></div>
    </div>`).join("");
}
function statBlock(){
  return Object.keys(state.stats).map(k=>`
    <div class="stat">
      <div class="statHead"><span>${statLabel(k)}</span><b>${state.stats[k]}</b></div>
      <div class="bar"><i style="width:${state.stats[k]}%"></i></div>
    </div>`).join("");
}
function drawEvent(){
  if(!state || state.current || state.result || state.ended || state.prologue)return;
  ensureV2State();

  const specials=specialTriggerCandidates();
  if(specials.length){
    const healthCritical=specials.filter(e=>e.conditions?.some(([label])=>label.includes("健康度")));
    const pool=healthCritical.length?healthCritical:specials;
    if(Math.random()<0.72){
      const ev=deep(rand(pool));
      state.usedSpecial.push(ev.id);
      ev.isSpecial=true;
      state.current=ev;
      save();
      render();
      return;
    }
  }

  let pool=EVENTS[phase().id]||EVENTS.entry;
  let candidates=pool.filter(e=>!state.used.includes(e.title));
  if(!candidates.length){
    state.used=[];
    candidates=pool;
  }
  const ev=deep(rand(candidates));
  state.used.push(ev.title);
  state.current=ev;
  save();
  render();
}

function choose(i){
  const ev=state.current;
  const ch=ev.choices[i];
  const roll=1+Math.floor(Math.random()*6);
  const deltas=[];

  ch.fx.forEach(([k,v])=>{
    state.stats[k]=clamp(state.stats[k]+v);
    deltas.push(`${statLabel(k)} ${v>=0?"+":""}${v}`);
  });

  let tier="bad";
  if(ev.isSpecial){
    let goodChance=.20;
    goodChance += Math.max(0,(state.stats.health-70))*0.0025;
    goodChance += Math.max(0,(state.stats.stress-70))*0.0015;
    goodChance += Math.max(0,(state.stats.luck-70))*0.001;
    goodChance=Math.min(.38,goodChance);
    tier=Math.random()<goodChance?"good":"bad";
  }else{
    tier=roll>=5?"good":roll<=2?"bad":"mid";
  }

  if(roll===6){
    state.stats.luck=clamp(state.stats.luck+2);
    deltas.push("運氣 +2");
  }
  if(roll===1){
    state.stats.health=clamp(state.stats.health-2);
    deltas.push("健康度 -2");
  }

  if(ev.isSpecial && ch.skill){
    applySkillPoints(ch.skill);
    deltas.push(`特殊事件點數 +${ch.skill}`);
  }

  let txt;
  if(ev.isSpecial){
    txt=tier==="good"?rand(ev.good):rand(ev.bad);
  }else{
    txt=roll>=5?"結果比預期順利，至少這次你沒有成為群組裡被 tag 的那個人。":
        roll<=2?"事情往不太妙的方向發展，你開始理解『職場經驗』通常就是踩雷後留下來的東西。":
        "沒有奇蹟，也沒有爆炸。你把這一回合撐過去了。";
  }

  const ended=ev.isSpecial?maybeTriggerEnding(ev,roll):false;
  state.result={roll,title:ev.title,text:txt,deltas,isSpecial:!!ev.isSpecial,tier,ended};
  state.logs.unshift({when:`${state.year}・${state.age}歲`,text:`${ev.title}｜${ch.label}｜骰到 ${roll}`});
  state.current=null;
  save();render();
}
function nextTurn(){state.result=null;state.turn++;if(state.turn>=phase().turns){state.logs.unshift({when:`${state.year}・${state.age}歲`,text:`完成 ${phase().name} 四回合，進入重大劇情：${phase().story}`});if(state.phase<PHASES.length-1){state.phase++;state.turn=0;state.year=phase().year;state.age=phase().age;state.salary+=12000;state.jobTitle=phase().name;state.used=[]}else{state.turn=phase().turns}}save();render()}
function resetGame(){if(confirm("確定要重開工程師人生？")){localStorage.removeItem("engineerLifeV6");state=null;render()}}

function engineerPrologue(){
  const pua = state.edu.tier==="S"
    ?"你從小就被灌輸『都念到這裡了，不進大公司要幹嘛？』，連過年親戚都已經預設你會年薪三百萬。"
    : state.edu.tier==="A"||state.edu.tier==="B"
    ?"爸媽一路跟你說『至少要進竹科，不然隔壁阿姨會問』，你也不知道為什麼人生 KPI 還包含親戚的面子。"
    :"你從小聽最多的一句話就是『學歷普通沒關係，進大公司一樣能翻身』，於是全家把竹科當成你的人生贖罪券。";
  return `<div class="box event prologueCard">
    <div class="kicker">SYSTEM BOOT · ENGINEER LIFE</div>
    <div class="profileGrid" style="margin:10px 0 12px">
      <div class="profileAvatar"><img src="${ENGINEER_AVATAR}"></div>
      <div><h2 style="margin:0 0 4px">${state.name}</h2><div style="font-size:11px;color:var(--muted)">${state.edu.school} ${state.edu.dept} ${state.edu.degree}<br>${state.company.name}｜${state.job.name}</div></div>
    </div>
    <div class="quote">「讀那麼多書，就是要賺大錢啊，不然你表哥在科技業你要怎麼跟人家比？」——某位每年過年都會問薪水的親戚</div>
    <p>終於，你從 <strong>${state.edu.school} ${state.edu.dept} ${state.edu.degree}</strong> 畢業了。論文口試、研究室熬夜、老師一句『再改一下』的陰影還沒完全散去，你已經穿著人生第一套自認像樣的襯衫，拿著識別證站在竹科門口。</p>
    <p>${pua}</p>
    <p>而現在，你真的進了 <strong>${state.company.name}</strong>，職稱是 <strong>${state.job.name}</strong>。你滿懷熱血地想著：我要學技術、升職、賺大錢、買房、讓爸媽在親戚群組裡抬頭挺胸。</p>
    <p>結果第一天早上，你先花了二十分鐘搞不懂門禁，接著被拉進一場完全聽不懂縮寫的會議，中午同事開始比較學歷，下午主管丟來一份 Excel，晚上 9:38 你手機亮起——<strong>「有空幫我看一下嗎？」</strong></p>
    <p>歡迎來到竹科。你以為自己是來改變世界的，世界目前比較想先看看你的肝能撐多久。</p>
    <div class="prologueMeta"><span>${state.company.name}</span><span>${state.job.name}</span><span>起薪 ${state.salary.toLocaleString()}</span><span>${state.edu.tier} 級學歷</span></div>
    <button class="primary" style="margin-top:14px" onclick="state.prologue=false;save();render()">開始我的賣肝人生 →</button>
  </div>`;
}

function centerCard(){
  if(state.prologue)return engineerPrologue();
  if(state.ended && state.ending){
    return `<div class="box event endingBox"><div class="endingBadge">CAREER ENDING</div><div class="kicker">工程師人生結局</div><h2>${state.ending.title}</h2><p>${state.ending.text}</p></div>
    <button class="primary" style="border-color:var(--red);color:var(--red);background:#201014" onclick="resetGame()">重新開始工程師人生</button>`;
  }
  if(state.current){
    return `<div class="box event">${state.current.isSpecial?`<div class="specialWarn">⚠ CONDITIONAL SPECIAL EVENT · 條件式特殊事件</div>`:""}<div class="kicker">${state.current.cat}</div><h2>${state.current.title}</h2><p>${state.current.desc}</p>${eventConditionsHTML(state.current)}</div>
    <div class="box"><div class="boxTitle">你要怎麼做？ <span>CHOICE</span></div>${state.current.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><b>${c.label}</b><span>${c.sub}</span><em>${c.risk}${state.current.isSpecial?`｜好結果約 20%`:""}</em></button>`).join("")}</div>`;
  }
  if(state.result){
    return `<div class="box ${state.result.ended?"endingBox":""}"><div class="boxTitle">${state.result.isSpecial?"特殊事件結果":"命運骰結果"} <span>RESULT</span></div><div class="resultDice">${state.result.roll}</div><div class="resultText">${state.result.text}</div><div class="deltaRow">${state.result.deltas.map(x=>`<span class="delta ${x.includes("特殊事件點數")?"skillPoint":x.includes("+")?"good":"bad"}">${x}</span>`).join("")}</div>${state.result.ended?"":`<button class="primary" style="margin-top:12px" onclick="nextTurn()">繼續下一回合 →</button>`}</div>`;
  }
  return `<div class="box event"><div class="kicker">CURRENT CHAPTER · ${phase().name}</div><h2>${state.turn+1} / ${phase().turns} 回合</h2><p>${phase().desc}</p><p class="note" style="margin-top:9px">條件式特殊事件會根據能力值觸發。健康度是最重要的生存能力；健康過低時，加班、實驗、輪班等事件會變得更危險。</p></div><button class="primary" onclick="drawEvent()">開始本回合事件 →</button>`;
}
function render(){const app=document.getElementById("app");if(!state){state=load();if(!state){app.innerHTML=startScreen();return}}ensureV2State();app.innerHTML=`<div class="topbar"><div class="logo"><div class="chip">EL</div>Engineer Life</div><div class="topmeta">PTT/BBS MODE · ${state.year} · ${state.age}歲 · ${state.jobTitle}</div></div><div class="shell"><aside class="left"><div class="box identity"><div class="boxTitle">USER PROFILE <span>#${Math.floor(1000+Math.random()*8999)}</span></div><div class="profileGrid"><div class="profileAvatar"><img src="${ENGINEER_AVATAR}"></div><div><h1>${state.name}</h1><div class="sub">${state.edu.school} ${state.edu.dept}<br>${state.edu.degree}｜${state.company?.name||"竹科"}｜${state.job?.name||state.jobTitle}</div></div></div><div class="tagrow"><span class="tag gold">${state.jobTitle}</span><span class="tag">${state.company?.name||"竹科"}</span><span class="tag">月薪 ${state.salary.toLocaleString()}</span></div></div><div class="box timeline"><div class="boxTitle">CAREER PATH <span>生涯路線</span></div>${timeline()}</div><button class="primary" onclick="save()">儲存</button><button class="primary" style="margin-top:8px;border-color:var(--red);color:var(--red);background:#201014" onclick="resetGame()">重開人生</button></aside><main class="center"><div class="metrics" style="grid-template-columns:repeat(6,minmax(0,1fr))"><div class="metric"><b>${state.age}</b><span>年齡</span></div><div class="metric"><b>${state.year}</b><span>年份</span></div><div class="metric"><b>${ovr(state.stats)}</b><span>綜合 OVR</span></div><div class="metric"><b>${state.salary.toLocaleString()}</b><span>月薪</span></div><div class="metric"><b>${state.skillPoints}</b><span>特殊事件點數</span></div><div class="metric"><b>${state.turn}/${phase().turns}</b><span>階段回合</span></div></div><div style="height:12px"></div>${centerCard()}<div class="box"><div class="boxTitle">RECENT LOG <span>最近紀錄</span></div>${state.logs.slice(0,7).map(l=>`<div class="log"><small>${l.when}</small><div>${l.text}</div></div>`).join("")}</div></main><aside class="right"><div class="box"><div class="boxTitle">BASIC STATS <span>能力值</span></div>${statBlock()}</div><div class="box"><div class="boxTitle">SYSTEM NOTE <span>V1</span></div><p class="note">V2 已加入條件式特殊事件：特殊事件不會隨機硬塞，而是必須達到對應能力門檻才可能觸發。整體結果約 20% 偏好、80% 偏壞；健康度是最重要的生存能力，過低時可能出現長期住院、被資遣或極端職涯終止結局。成功處理特殊事件可以獲得特殊事件點數。</p></div></aside></div>`}
render();
</script>

<script id="v3-responsive-js">
function v3MobileProfile(){
  if(!state)return "";
  return `<div class="mobileProfile">
    <div class="box identity">
      <div class="boxTitle">USER PROFILE <span>${state.edu.tier} 級學歷</span></div>
      <div class="profileGrid"><div class="profileAvatar"><img src="${ENGINEER_AVATAR}"></div><div><h1>${state.name}</h1><div class="sub">${state.edu.school} ${state.edu.dept}<br>${state.edu.degree}｜${state.company?.name||"竹科"}｜${state.job?.name||state.jobTitle}</div></div></div>
      <div class="tagrow">
        <span class="tag gold">${state.jobTitle}</span>
        <span class="tag">竹科</span>
        <span class="tag">月薪 ${state.salary.toLocaleString()}</span>
      </div>
    </div>
  </div>`;
}

const V3_prevRender=render;
render=function(){
  V3_prevRender();
  if(!state)return;

  const center=document.querySelector(".center");
  if(center && !center.querySelector(".mobileProfile")){
    center.insertAdjacentHTML("afterbegin",v3MobileProfile());
  }
};
</script>


<script id="v5-dice-ui-fix">
document.addEventListener("input",(e)=>{
  if(e.target && e.target.id==="nameInput"){
    window._draftName=e.target.value;
    const nameEl=document.getElementById("previewName");
    const statEl=document.getElementById("previewStats");
    if(nameEl)nameEl.textContent=e.target.value||"未命名工程師";
    if(statEl && window._draftEdu && window._draftJob){
      statEl.innerHTML=previewStatsV4(window._draftEdu,e.target.value||"未命名工程師",window._draftJob);
    }
  }
});
</script>


<script id="v6-runtime-guard">
window.addEventListener("error",(e)=>{
  console.error("Engineer Life runtime error:",e.error||e.message);
  const app=document.getElementById("app");
  if(app && !document.getElementById("runtimeErrorBox")){
    app.insertAdjacentHTML("afterbegin",`
      <div id="runtimeErrorBox" style="position:relative;z-index:9999;margin:10px;padding:12px;border:1px solid #ff5d73;background:#240d13;color:#ffd6dc;font:12px/1.6 monospace">
        ⚠ 遊戲執行錯誤：${String(e.message||"unknown error")}
      </div>`);
  }
});
</script>
